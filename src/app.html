<title>SUBBU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#EBEFED; --sunken:#E4E9E6;
  --ink:#14201B; --ink-2:#4A5752; --ink-3:#6F7B76; --line:#D9DFDC; --line-strong:#C3CCC8;
  --accent:#0E6B57; --accent-hover:#0A5645; --accent-ink:#FFFFFF; --accent-soft:#DCEEE8;
  --warn:#8F5300; --warn-soft:#FBEBCF;
  --trial:#5A43B3; --trial-soft:#ECE8FA;
  --danger:#B42318; --danger-soft:#FCE4E1;
  --c-ent:#C4552D; --c-music:#1F7F99; --c-work:#5750C9; --c-cloud:#667A1F; --c-health:#B83C73; --c-learn:#9E720A;
  --c-mobile:#2A72C4; --c-apps:#9A4DB5; --c-bills:#8A6D4B; --c-debt:#52606D;
  --shadow:0 18px 50px -12px rgba(20,32,27,.28);
  --backdrop:rgba(20,32,27,.38);
  --f-display:"Bricolage Grotesque", "Anuphan", "Leelawadee UI", "Segoe UI", system-ui, sans-serif;
  --f-body:"Instrument Sans", "IBM Plex Sans Thai", "Leelawadee UI", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", "IBM Plex Sans Thai", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r:10px; --r-sm:7px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0D1311; --surface:#141C19; --surface-2:#1B2522; --sunken:#101815;
    --ink:#E6EEEA; --ink-2:#A8B4AF; --ink-3:#7F8B86; --line:#27322E; --line-strong:#36433E;
    --accent:#4CC3A2; --accent-hover:#6FD3B7; --accent-ink:#04221A; --accent-soft:#12372D;
    --warn:#F2B55C; --warn-soft:#3A2A0F;
    --trial:#B5A6F7; --trial-soft:#262042;
    --danger:#FF8C7C; --danger-soft:#3D1712;
    --c-ent:#F08A5F; --c-music:#5CC0DA; --c-work:#9D98F6; --c-cloud:#AAC259; --c-health:#EE7DAF; --c-learn:#E1B445;
    --c-mobile:#6FA8EE; --c-apps:#CB8AE6; --c-bills:#CFAE86; --c-debt:#A7B4C1;
    --shadow:0 18px 50px -12px rgba(0,0,0,.6);
    --backdrop:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0D1311; --surface:#141C19; --surface-2:#1B2522; --sunken:#101815;
  --ink:#E6EEEA; --ink-2:#A8B4AF; --ink-3:#7F8B86; --line:#27322E; --line-strong:#36433E;
  --accent:#4CC3A2; --accent-hover:#6FD3B7; --accent-ink:#04221A; --accent-soft:#12372D;
  --warn:#F2B55C; --warn-soft:#3A2A0F;
  --trial:#B5A6F7; --trial-soft:#262042;
  --danger:#FF8C7C; --danger-soft:#3D1712;
  --c-ent:#F08A5F; --c-music:#5CC0DA; --c-work:#9D98F6; --c-cloud:#AAC259; --c-health:#EE7DAF; --c-learn:#E1B445;
    --c-mobile:#6FA8EE; --c-apps:#CB8AE6; --c-bills:#CFAE86; --c-debt:#A7B4C1;
  --shadow:0 18px 50px -12px rgba(0,0,0,.6);
  --backdrop:rgba(0,0,0,.55);
}

*{box-sizing:border-box}
[hidden]{display:none!important}
html[lang="th"] body{line-height:1.6}
:lang(th) .eyebrow,:lang(th) .lhead,:lang(th) .week h3,:lang(th) .d-sec h3,:lang(th) .pick-body h3,:lang(th) .cal-wd{letter-spacing:0}
:lang(th) h1,:lang(th) h2,:lang(th) h3{letter-spacing:0}
body{background:var(--bg);color:var(--ink);font:400 14px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--f-display);font-weight:650;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}

.wrap{max-width:1180px;margin:0 auto;padding-inline:24px}
@media (max-width:640px){.wrap{padding-inline:16px}}

/* save status, currency, preview */
.save{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-3);white-space:nowrap}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
.save[data-s="idle"]::before{display:none}
.save[data-s="saving"]::before{background:var(--warn);animation:blink 1s ease-in-out infinite}
.save[data-s="error"]{color:var(--danger)}.save[data-s="error"]::before{background:var(--danger)}
.save[data-s="local"]::before{background:var(--ink-3)}
@keyframes blink{50%{opacity:.3}}
@media (max-width:640px){.save .long{display:none}}
.ov-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.rate{margin-top:12px;font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rate .link{border:0;background:none;padding:2px 0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.rate form{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rate .input{height:32px;width:96px;font-family:var(--f-mono);padding:0 8px}
.rate .err{flex-basis:100%}
.price-row{display:flex;gap:6px}
.price-row .money{flex:1;min-width:0}
.cur-pick{border:0;margin:0;padding:2px;display:inline-flex;background:var(--sunken);border-radius:8px;gap:2px;flex:none}
.cur-pick input{position:absolute;opacity:0;width:1px;height:1px}
.cur-pick label{display:grid;place-items:center;padding:0 9px;height:34px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.cur-pick input:checked+label{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.cur-pick input:focus-visible+label{outline:2px solid var(--accent);outline-offset:1px}
.cur-tag{font-family:var(--f-mono);font-size:10.5px;color:var(--ink-3);margin-left:4px;letter-spacing:.02em}
.preview-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:10px 14px;border:1px dashed var(--line-strong);border-radius:var(--r-sm);background:var(--surface-2);font-size:13.5px;color:var(--ink-2)}
.toast.bad svg{color:var(--danger)}
.seg{display:inline-flex;background:var(--sunken);border-radius:7px;padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:5px;font-size:12px;font-weight:500;color:var(--ink-2);cursor:pointer}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--f-display);font-weight:750;font-size:20px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.brand svg{flex:none}
.topbar .date{color:var(--ink-3);font-size:13px;white-space:nowrap}
.topbar .seg{flex-wrap:nowrap;flex:none}
@media (max-width:980px){.topbar .date{display:none}}
@media (max-width:820px){.acct .lbl{display:none}}
@media (max-width:560px){.topbar .wrap{gap:6px}.topbar #installBtn{padding:0 9px}.topbar .seg button{padding:4px 7px}}
@media (max-width:400px){.topbar .save{display:none}.brand{font-size:18px}}
.topbar .spacer{flex:1}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .15s,border-color .15s,color .15s}
.btn svg{flex:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.secondary{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn.secondary:hover{border-color:var(--ink-3)}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
[data-theme="dark"] .btn.danger{color:#2a0904}
.btn.danger-text{background:transparent;color:var(--danger);padding-inline:10px}
.btn.danger-text:hover{background:var(--danger-soft)}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled,.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.icon-btn{width:36px;height:36px;display:inline-grid;place-items:center;border-radius:8px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
@media (max-width:520px){.btn-label-long{display:none}.topbar .date{display:none}}

main{padding-block:28px 72px;display:flex;flex-direction:column;gap:28px}

/* overview */
.overview{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:40px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.spend .figure{font-family:var(--f-display);font-weight:750;font-size:clamp(44px,7vw,64px);line-height:1;letter-spacing:-.035em;margin:10px 0 12px;font-variant-numeric:tabular-nums}
.spend .figure .cents{font-size:.5em;letter-spacing:-.01em;vertical-align:.62em;margin-left:2px}
.spend .figure .per{font-family:var(--f-body);font-weight:500;font-size:16px;letter-spacing:0;color:var(--ink-3);margin-left:6px}
.spend .sub{color:var(--ink-2);font-size:15px}
.spend .sub b{font-weight:600;color:var(--ink)}
.callout{display:flex;gap:10px;align-items:flex-start;margin-top:18px;padding:11px 13px;border-radius:var(--r-sm);background:var(--trial-soft);color:var(--ink);font-size:13.5px;max-width:460px}
.callout svg{color:var(--trial);flex:none;margin-top:2px}
.callout button{border:0;background:none;padding:0;color:var(--trial);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.breakdown h2{font-size:12px}
.bar{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px;margin:14px 0 16px;background:var(--surface-2)}
.bar span{display:block;height:100%;background:var(--cat);min-width:3px}
.legend{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 28px}
.legend li{display:grid;grid-template-columns:10px 1fr auto auto;align-items:baseline;gap:8px;font-size:13.5px;padding-block:5px;border-bottom:1px solid var(--line)}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--cat);align-self:center}
.legend .amt{color:var(--ink)}
.legend .pct{color:var(--ink-3);font-size:12px;width:34px;text-align:right}
@media (max-width:860px){.overview{grid-template-columns:1fr;gap:28px}}
@media (max-width:460px),(min-width:861px) and (max-width:1100px){.legend{grid-template-columns:1fr}}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;padding:20px 22px 0}
.panel-head h2{font-size:20px}
.panel-head .meta{color:var(--ink-2);font-size:13.5px}
.panel-head .meta b{color:var(--ink);font-weight:600}

/* timeline */
.tl-scroll{overflow-x:auto;padding:4px 22px 0}
.tl{position:relative;min-width:640px;height:150px}
.tl-axis{position:absolute;left:0;right:0;bottom:34px;height:1px;background:var(--line-strong)}
.tl-tick{position:absolute;bottom:30px;width:1px;height:9px;background:var(--line-strong)}
.tl-tick.wk{height:13px;bottom:28px;background:var(--ink-3)}
.tl-label{position:absolute;bottom:6px;transform:translateX(-50%);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.tl-label.today{color:var(--accent);font-weight:600}
.tl-label:first-of-type{transform:none}
.tl-now{position:absolute;left:0;bottom:34px;top:6px;width:2px;background:var(--accent);border-radius:2px}
.tl-dot{position:absolute;transform:translateX(-50%);width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);display:grid;place-items:center;font-size:10.5px;font-weight:600;letter-spacing:.02em;cursor:pointer;background:color-mix(in srgb,var(--cat) 18%,var(--surface));color:var(--cat);padding:0}
.tl-dot.trial{border:2px dashed var(--trial)}
.tl-dot:hover,.tl-dot:focus-visible{z-index:3;background:var(--cat);color:var(--surface)}
.tl-dot .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;letter-spacing:0;padding:6px 9px;border-radius:6px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s}
.tl-dot:hover .tip,.tl-dot:focus-visible .tip{opacity:1}
.tl-dot.edge-l .tip{left:0;transform:none}
.tl-dot.edge-r .tip{left:auto;right:0;transform:none}

.week{padding:6px 22px 18px}
.week h3{font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding:14px 0 6px;border-top:1px solid var(--line)}
.week ul{list-style:none;margin:0;padding:0}
.wrow{width:100%;display:grid;grid-template-columns:62px 32px minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:9px 8px;margin-inline:-8px;border:0;background:none;border-radius:7px;text-align:left;cursor:pointer;width:calc(100% + 16px)}
.wrow:hover{background:var(--surface-2)}
.wrow .day{font-size:12.5px;color:var(--ink-2);line-height:1.2}
.wrow .day b{display:block;font-family:var(--f-display);font-size:17px;color:var(--ink);font-weight:650}
.wrow .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .nm small{font-weight:400;color:var(--ink-3);font-size:13px;margin-left:6px}
.wrow .amt{font-size:14px}
.week .none{color:var(--ink-3);padding:6px 0}
@media (max-width:560px){.wrow{grid-template-columns:48px 32px minmax(0,1fr) auto}.wrow .pillcell{display:none}.wrow .nm small{display:none}}

/* reminders */
.bell{position:relative}
.bell .badge{position:absolute;top:3px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--warn);color:var(--surface);font-size:10.5px;font-weight:600;display:grid;place-items:center;line-height:1;box-shadow:0 0 0 2px var(--bg)}
.rem-strip{border:1px solid color-mix(in srgb,var(--warn) 35%,var(--line));background:color-mix(in srgb,var(--warn-soft) 55%,var(--surface));border-radius:var(--r);padding:14px 16px}
.rem-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.rem-head svg{color:var(--warn);flex:none}
.rem-head h2{font-family:var(--f-body);font-size:14.5px;font-weight:600}
.rem-head .grow{flex:1}
.rem-list{list-style:none;margin:0;padding:0}
.rem-item{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0}
.rem-item+.rem-item{border-top:1px solid color-mix(in srgb,var(--warn) 18%,var(--line))}
.rem-item .rt{display:block;font-size:13.5px;color:var(--ink-2);min-width:0}
.rem-item .rt b{color:var(--ink);font-weight:600}
.rem-item .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.rem-item .open{border:0;background:none;padding:0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.rem-item .open:hover b{text-decoration:underline;text-underline-offset:2px}
.rem-modal .r-body{padding:6px 20px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.r-body h3{font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 4px}
:lang(th) .r-body h3{letter-spacing:0}
.r-body .none{color:var(--ink-3);font-size:13.5px;padding:4px 0}
.r-body .rem-item+.rem-item{border-top-color:var(--line)}
.up-row{display:grid;grid-template-columns:86px 28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;font-size:13.5px}
.up-row+.up-row{border-top:1px solid var(--line)}
.up-row .when{color:var(--ink-2);font-weight:600}
.up-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.up-row .ch{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.up-row .logo{--sz:28px}
.phone-box{border:1px solid var(--line);border-radius:10px;padding:14px;background:var(--surface-2);display:flex;flex-direction:column;gap:10px}
.phone-box p{font-size:13.5px;color:var(--ink-2)}
.phone-box .note-s{font-size:12.5px;color:var(--ink-3)}
.gcal-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.gcal-list li{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 0;font-size:13.5px}
.gcal-list li+li{border-top:1px solid var(--line)}
.gcal-list .logo{--sz:28px}
.gcal-list .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gcal-list .nm small{color:var(--ink-3);margin-left:6px}
a.btn{text-decoration:none}
.btn .ext{opacity:.7}
@media (max-width:560px){.rem-item{grid-template-columns:32px minmax(0,1fr)}.rem-item .acts{grid-column:2;justify-content:flex-start}.up-row{grid-template-columns:70px 28px minmax(0,1fr)}.up-row .ch{grid-column:3}}

/* account + sync */
.acct{gap:7px;padding-inline:10px}
.acct .av{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px;font-weight:600;flex:none}
.acct svg{flex:none}
@media (max-width:640px){.acct .lbl{display:none}}
.acct-modal{width:min(440px,calc(100% - 32px))}
.acct-modal .a-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:14px}
.a-who{display:flex;align-items:center;gap:12px}
.a-who .av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:18px;font-weight:600;flex:none}
.a-who b{display:block;font-weight:600}
.a-who span{color:var(--ink-3);font-size:13px;word-break:break-all}
.a-body p{font-size:13.5px;color:var(--ink-2)}
.a-body .note-s{font-size:12.5px;color:var(--ink-3)}
.g-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:42px;padding:0 18px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:600;cursor:pointer}
.g-btn:hover{border-color:var(--ink-3)}
.g-btn:disabled{opacity:.5;cursor:progress}
.line-box{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.line-box h3{font-family:var(--f-body);font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.line-box h3 .ok{color:var(--accent)}
.line-step{display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.line-step > span{font-weight:600;color:var(--ink)}
.line-btn{background:#06C755;color:#fff;border-color:#06C755}
.line-btn:hover{background:#05b34c}
.line-code{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.line-code .num{font-size:28px;font-weight:600;letter-spacing:.18em;padding:6px 12px;border-radius:8px;background:var(--surface-2)}
.migrate-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));border-radius:var(--r);background:color-mix(in srgb,var(--accent-soft) 60%,var(--surface))}
.migrate-bar b{display:block;font-weight:600}
.migrate-bar span{font-size:13.5px;color:var(--ink-2)}
.migrate-bar .acts{display:flex;gap:8px}

/* calendar */
.up-title{display:flex;align-items:center;gap:12px 16px;flex-wrap:wrap}
.cal-nav{display:flex;align-items:center;gap:4px;padding:12px 22px 10px;flex-wrap:wrap}
.cal-nav .btn{margin-left:6px}
.cal-note{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.cal-scroll{padding:0 22px}
.cal{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.cal-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-row+.cal-row{border-top:1px solid var(--line)}
.cal-wd{padding:7px 8px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2)}
.cal-wd abbr{text-decoration:none}
.cal-cell{min-height:104px;display:flex;min-width:0}
.cal-cell+.cal-cell{border-left:1px solid var(--line)}
.cal-cell.out{background:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--line) 45%,transparent) 6px 7px)}
.cal-day{flex:1;min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:6px 7px 7px;border:0;background:none;text-align:left;cursor:pointer;border-radius:0}
.cal-day:hover{background:color-mix(in srgb,var(--surface-2) 70%,var(--surface))}
.cal-day:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;border-radius:0}
.cal-day.sel{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day .dn{font-size:12.5px;font-weight:600;color:var(--ink-2);width:24px;height:24px;display:grid;place-items:center;border-radius:50%;margin:-2px 0 1px -3px;font-variant-numeric:tabular-nums}
.cal-day.past .dn{color:var(--ink-3);font-weight:500}
.cal-day.today .dn{background:var(--accent);color:var(--accent-ink)}
.cal-items{display:flex;flex-direction:column;gap:2px;min-width:0}
.cal-chip{display:flex;align-items:center;gap:5px;font-size:11.5px;line-height:1.35;color:var(--ink);min-width:0;padding:1px 5px 1px 4px;border-radius:4px;background:color-mix(in srgb,var(--cat) 12%,transparent)}
.cal-chip i{width:6px;height:6px;border-radius:2px;background:var(--cat);flex:none}
.cal-chip .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-chip.was{background:transparent;color:var(--ink-3)}
.cal-chip.trial{box-shadow:inset 0 0 0 1px var(--trial)}
.cal-more{font-size:11px;color:var(--ink-3);padding-left:4px}
.cal-tot{margin-top:auto;font-size:11px;color:var(--ink-3);text-align:right;padding-top:2px}
.cal-dots{display:none;gap:3px;justify-content:center;margin-top:auto}
.cal-dots i{width:6px;height:6px;border-radius:50%;background:var(--cat)}
.cal-detail h3 .num{text-transform:none;letter-spacing:0;color:var(--ink)}
.cal-detail{margin-top:10px}
@media (max-width:760px){
  .cal-nav,.cal-scroll{padding-inline:16px}
  .cal-note{flex-basis:100%;margin:6px 0 0}
  .cal-cell{min-height:58px}
  .cal-items,.cal-tot{display:none}
  .cal-dots{display:flex}
  .cal-day{align-items:center;padding:6px 2px}
  .cal-day .dn{margin:0}
  .cal-wd{text-align:center;padding-inline:0;font-size:10.5px;letter-spacing:.03em}
}

/* logos */
.logo{--sz:32px;width:var(--sz);height:var(--sz);border-radius:calc(var(--sz)*.25);display:grid;place-items:center;flex:none;background:var(--lbg);color:var(--lfg);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--ink) 10%,transparent);overflow:hidden;font-weight:700;letter-spacing:-.02em;line-height:1;font-family:var(--f-body)}
.logo svg{width:58%;height:58%;fill:currentColor}
.logo.glyph svg{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;width:56%;height:56%}
.logo .t{font-size:calc(var(--sz)*var(--fs,.36));white-space:nowrap}
.logo.mono-l{background:color-mix(in srgb,var(--cat) 16%,var(--surface));color:var(--cat);font-weight:600;letter-spacing:.02em}
.logo.mono-l .t{font-size:calc(var(--sz)*.36)}
.logo.sm{--sz:24px}.logo.lg{--sz:48px}.logo.xl{--sz:40px}
.tl-dot .logo{--sz:24px;border-radius:50%}
.tl-dot{background:var(--surface)!important;padding:0;overflow:visible}
.tl-dot:hover .logo,.tl-dot:focus-visible .logo{transform:scale(1.12)}
.chip .logo{--sz:24px;border-radius:50%}

/* service picker */
.pick{display:flex;flex-direction:column;min-height:0;flex:1}
.pick-tools{padding:14px 20px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.pick-tools .field-inline{flex:none}
.pick-tools .search{width:100%}
.pick-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.pick-cats button{flex:none;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;height:30px;padding:0 12px;font-size:12.5px;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.pick-cats button:hover{color:var(--ink);border-color:var(--ink-3)}
.pick-cats button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.pick-body{overflow-y:auto;padding:6px 20px 20px;flex:1}
.pick-body h3{font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 8px}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.svc-opt{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);cursor:pointer;text-align:left;min-width:0}
.svc-opt:hover{border-color:var(--accent);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface))}
.svc-opt[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.svc-opt span.tx{min-width:0;display:flex;flex-direction:column}
.svc-opt b{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc-opt small{font-size:12px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.svc-opt.custom{border-style:dashed;border-color:var(--line-strong)}
.pick-empty{padding:28px 0;text-align:center;color:var(--ink-2)}
.pick-note{font-size:12px;color:var(--ink-3);margin-top:16px}
.svc-bar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.svc-bar .tx{flex:1;min-width:0}
.svc-bar b{display:block;font-weight:600}
.svc-bar small{color:var(--ink-3);font-size:12.5px}
.plans{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.plans .lbl{font-size:12.5px;color:var(--ink-3);margin-right:2px}
.plans button{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:5px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:baseline}
.plans button:hover{border-color:var(--accent)}
.plans button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.plans button .num{color:var(--ink-2);font-size:12px}
.plans .help{flex-basis:100%}
.inst{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;padding:14px;border:1px solid var(--line);border-radius:10px;margin-top:-6px}
.inst .help.full{grid-column:1/-1}
@media (max-width:520px){.inst{grid-template-columns:1fr}}
.progress{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:10px 0 8px}
.progress span{display:block;height:100%;background:var(--cat,var(--accent));border-radius:99px}
.plan-facts{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:13.5px;color:var(--ink-2)}
.plan-facts b{color:var(--ink);font-weight:600}
.sub .debt{display:block;margin-top:6px;font-size:13.5px;color:var(--ink-2)}

/* monogram */
.mono{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;letter-spacing:.02em;background:color-mix(in srgb,var(--cat) 16%,var(--surface));color:var(--cat);flex:none}
.mono.lg{width:48px;height:48px;border-radius:11px;font-size:16px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.trial{background:var(--trial-soft);color:var(--trial)}
.pill.up{background:var(--danger-soft);color:var(--danger)}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.ok::before,.pill.plain::before{display:none}

/* ledger */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 22px}
.tabs{display:inline-flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px}
.tabs button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:500;font-size:13.5px;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.tabs .count{font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3)}
.toolbar .grow{flex:1}
.field-inline{position:relative}
.field-inline svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3);pointer-events:none}
.input,.select{height:38px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 12px;font-size:14px;transition:border-color .15s,box-shadow .15s}
.input::placeholder{color:var(--ink-3)}
.input:hover,.select:hover{border-color:var(--ink-3)}
.input:focus,.select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.input[aria-invalid="true"]{border-color:var(--danger)}
.input[aria-invalid="true"]:focus{box-shadow:0 0 0 3px color-mix(in srgb,var(--danger) 20%,transparent)}
.search{padding-left:34px;width:220px}
@media (max-width:760px){.toolbar .grow{display:none}.field-inline{flex:1 1 100%}.search{width:100%}.toolbar .select{flex:1}}

.lhead,.row{display:grid;grid-template-columns:32px minmax(0,1.7fr) minmax(0,1.15fr) minmax(0,.95fr) minmax(0,.8fr) minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:center}
.lhead{padding:8px 22px;border-block:1px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.lhead .r,.row .r{text-align:right}
.rows{list-style:none;margin:0;padding:0}
.rows li+li{border-top:1px solid var(--line)}
.row{width:100%;border:0;background:none;text-align:left;padding:13px 22px;cursor:pointer}
.row:hover{background:color-mix(in srgb,var(--surface-2) 70%,var(--surface))}
.row:focus-visible{outline-offset:-2px;border-radius:0}
.row .svc{min-width:0}
.row .svc b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .svc span{display:block;color:var(--ink-3);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .cat{display:flex;align-items:center;gap:7px;color:var(--ink-2);font-size:13.5px;min-width:0}
.row .cat i{width:8px;height:8px;border-radius:2px;background:var(--cat);flex:none}
.row .bill small,.row .eq small{color:var(--ink-3);font-family:var(--f-body);font-size:12px;margin-left:2px}
.row .eq{color:var(--ink-2)}
.row .next{font-size:13.5px;line-height:1.3}
.row .next small{display:block;color:var(--ink-3);font-size:12.5px}
.row .status{display:flex;gap:6px;flex-wrap:wrap}
.row.is-cancelled .svc b,.row.is-cancelled .bill{color:var(--ink-3)}
.row.is-cancelled .bill span{text-decoration:line-through}
.lfoot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 22px;border-top:1px solid var(--line);color:var(--ink-3);font-size:13px}
.noresults{padding:40px 22px;text-align:center;color:var(--ink-2)}
.noresults p+p{margin-top:10px}
@media (max-width:760px){
  .lhead{display:none}
  .row{grid-template-columns:32px minmax(0,1fr) auto;grid-template-areas:"m s b" "m n st";row-gap:6px;padding:14px 16px}
  .row .logo{grid-area:m;align-self:start}
  .row .svc{grid-area:s}.row .bill{grid-area:b;text-align:right}
  .row .next{grid-area:n}.row .next small{display:inline;margin-left:6px}
  .row .status{grid-area:st;justify-content:flex-end}
  .row .cat,.row .eq{display:none}
  .toolbar,.lfoot{padding-inline:16px}
  .panel-head{padding-inline:16px}.tl-scroll{padding-inline:16px}.week{padding-inline:16px}
}

/* empty / error / loading */
.state{padding:56px 24px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.state h2{font-size:26px}
.state p{color:var(--ink-2);max-width:46ch;font-size:15px}
.state > .glyph{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:4px}
.state.error > .glyph{background:var(--danger-soft);color:var(--danger)}
.state .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.presets{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px 0 5px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:13.5px;font-weight:500}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip .mono{width:24px;height:24px;border-radius:50%;font-size:10px}
.chip .num{color:var(--ink-3);font-size:12px}
.state .hint{font-size:13px;color:var(--ink-3)}

.sk{background:linear-gradient(90deg,var(--surface-2) 0%,var(--sunken) 50%,var(--surface-2) 100%);background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:6px}
@keyframes sk{from{background-position:100% 0}to{background-position:-100% 0}}
.sk-over{display:grid;grid-template-columns:1fr 1.05fr;gap:40px;padding-bottom:28px;border-bottom:1px solid var(--line)}
.sk-col{display:flex;flex-direction:column;gap:12px}
.sk-rows{padding:8px 22px 18px;display:flex;flex-direction:column;gap:0}
.sk-row{display:grid;grid-template-columns:32px 1fr 90px;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
@media (max-width:860px){.sk-over{grid-template-columns:1fr}}

/* dialogs */
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:var(--backdrop)}
.drawer{margin:0 0 0 auto;height:100%;max-height:100%;width:min(460px,100%);max-width:100%;border-left:1px solid var(--line)}
.drawer[open]{display:flex;flex-direction:column;animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
.d-head{display:flex;gap:14px;align-items:center;padding:20px 20px 16px;padding-top:calc(20px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line)}
.d-head h2{font-size:22px;line-height:1.15}
.d-head p{color:var(--ink-3);font-size:13.5px}
.d-head .x{margin-left:auto;align-self:flex-start}
.d-body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:24px}
.d-price{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.d-price .big{font-family:var(--f-display);font-weight:750;font-size:40px;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.d-price .per{color:var(--ink-3);font-size:15px}
.d-price .pills{display:flex;gap:6px;flex-basis:100%;margin-top:8px;flex-wrap:wrap}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;margin:0;border-top:1px solid var(--line)}
.facts div{padding:11px 0;border-bottom:1px solid var(--line)}
.facts div:nth-child(odd){padding-right:14px}
.facts dt{font-size:12px;color:var(--ink-3);margin-bottom:2px}
.facts dd{margin:0;font-weight:500}
.facts dd small{display:block;color:var(--ink-3);font-weight:400;font-size:12.5px}
.d-sec h3{font-family:var(--f-body);font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin-bottom:10px}
.hist{list-style:none;margin:0;padding:0;border-left:2px solid var(--line);margin-left:4px}
.hist li{position:relative;padding:0 0 12px 16px;display:flex;justify-content:space-between;gap:12px;font-size:13.5px}
.hist li:last-child{padding-bottom:0}
.hist li::before{content:"";position:absolute;left:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line-strong)}
.hist li.cur::before{border-color:var(--accent);background:var(--accent)}
.hist .chg{color:var(--danger);font-size:12.5px;margin-left:6px}
.note{background:var(--surface-2);border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
.d-foot{border-top:1px solid var(--line);padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.d-foot .grow{flex:1}
.confirm{border-top:1px solid var(--line);padding:14px 20px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));background:var(--danger-soft);display:flex;flex-direction:column;gap:10px}
.confirm p{font-size:13.5px}
.confirm div{display:flex;gap:8px}
@media (max-width:520px){.drawer{width:100%;border-left:0}}

.modal{width:min(640px,calc(100% - 32px));max-height:calc(100% - 32px);border-radius:14px;margin:auto}
.modal[open]{display:flex;flex-direction:column;animation:pop .18s ease-out}
.modal.picking{height:min(760px,calc(100% - 32px))}
@keyframes pop{from{transform:translateY(8px);opacity:.5}to{transform:none;opacity:1}}
.modal form{display:flex;flex-direction:column;min-height:0;flex:1}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.m-head h2{font-size:20px}
.m-body{padding:18px 20px;overflow-y:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.m-body .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label,.fld .lbl{font-size:13px;font-weight:600;color:var(--ink)}
.fld label .opt{font-weight:400;color:var(--ink-3)}
.fld .input,.fld .select{width:100%}
.fld textarea.input{height:auto;min-height:68px;padding:9px 12px;resize:vertical}
.money{position:relative}
.money span{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-family:var(--f-mono)}
.money .input{padding-left:26px;font-family:var(--f-mono)}
.err{color:var(--danger);font-size:12.5px;display:flex;gap:5px;align-items:center}
.help{color:var(--ink-3);font-size:12.5px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.check input{width:17px;height:17px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.check b{display:block;font-weight:600;font-size:13.5px}
.check span{color:var(--ink-3);font-size:12.5px}
.summary-line{grid-column:1/-1;padding:11px 13px;background:var(--accent-soft);border-radius:8px;font-size:13.5px;color:var(--ink)}
.formerr{grid-column:1/-1;padding:11px 13px;background:var(--danger-soft);color:var(--danger);border-radius:8px;font-size:13.5px;font-weight:500}
.m-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 20px;border-top:1px solid var(--line)}
@media (max-width:520px){.m-body{grid-template-columns:1fr}.modal{width:100%;max-width:100%;max-height:100%;height:100%;border-radius:0}}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--bg);padding:10px 10px 10px 16px;border-radius:10px;display:flex;align-items:center;gap:14px;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.toast svg{color:var(--accent);flex:none}

          <option value="Cash" data-method>Cash</option>

        <input type="checkbox" id="f-inst" name="inst">

      <button type="submit" class="btn primary" id="f-submit">Add subscription</button>

/* ---------- (de)serialization — stored rows are untrusted ---------- */
function toDoc(s){
  return { name:s.name, brand:s.brand || null, plan:s.plan||"", cat:s.cat, price:s.price, currency:s.currency, cycle:s.cycle,
    next:iso(s.next), started:iso(s.started), status:s.status, paidOff:!!s.paidOff, remind:s.remind, method:s.method, notes:s.notes||"",
    inst: s.inst ? {last:iso(s.inst.last), total:s.inst.total || null} : null,
    history: s.history ? s.history.map(h => ({date:iso(h.date), price:h.price})) : null,
    cancelledOn: s.cancelledOn ? iso(s.cancelledOn) : null, ack:s.ack || null, updatedAt:new Date().toISOString() };
}
function fromDoc(id, d){
  if (!d || typeof d.name !== "string" || !d.name.trim()) return null;
  const price = Number(d.price); if (!(price > 0)) return null;
  const s = {
    id, name:d.name.slice(0,80), plan:String(d.plan||"").slice(0,80),
    brand: "brand" in d ? (BRAND[d.brand] ? d.brand : null) : matchBrand(d.name),
    cat: CATS[d.cat] ? d.cat : "apps", price, currency: CURRENCIES.includes(d.currency) ? d.currency : "THB",
    cycle: MONTHS[d.cycle] ? d.cycle : "monthly", next: parseISO(d.next) || TODAY, started: parseISO(d.started) || TODAY,
    status: ["active","trial","cancelled"].includes(d.status) ? d.status : "active", paidOff: !!d.paidOff,
    remind: [0,1,3,7].includes(Number(d.remind)) ? Number(d.remind) : 3, method:String(d.method||"Bank debit").slice(0,40),
    notes:String(d.notes||"").slice(0,1000), cancelledOn: parseISO(d.cancelledOn), ack: parseISO(d.ack) ? String(d.ack).slice(0,10) : null,
    inst: d.inst && parseISO(d.inst.last) ? {last:parseISO(d.inst.last), total: Number.isInteger(d.inst.total) && d.inst.total > 0 && d.inst.total <= 600 ? d.inst.total : null} : null,
    history: Array.isArray(d.history) ? d.history.map(h => ({date:parseISO(h && h.date), price:Number(h && h.price)})).filter(h => h.date && h.price > 0) : null
  };
  if (s.history && s.history.length < 2) s.history = null;
  if (s.status === "cancelled" && !s.cancelledOn) s.cancelledOn = TODAY;
  // A stored date that has passed means that charge already happened: roll forward for display.
  if (s.status !== "cancelled"){
    if (s.status === "trial" && daysUntil(s.next) < 0) s.status = "active";
    let guard = 0; while (daysUntil(s.next) < 0 && guard++ < 600) s.next = step(s.next, s.cycle);
    if (s.inst && s.next > s.inst.last){ s.status = "cancelled"; s.paidOff = true; s.cancelledOn = new Date(s.inst.last); }
  }
  return s;
}

/* ---------- storage: artifact db, else this browser, else memory ---------- */
function makeQueue(){ const q = {}; return (key, fn) => { const p = (q[key] || Promise.resolve()).catch(() => {}).then(fn); q[key] = p; return p; }; }
function retryOnce(fn){ return fn().catch(e => { if (e && e.code === "unavailable") return new Promise(r => setTimeout(r, 400 + Math.random()*600)).then(fn); throw e; }); }
function dbStore(db){

    mode:"cloud",
    subscribe(onSubs, onSettings, onError){
      unsubs.forEach(u => u()); unsubs = [];
      unsubs.push(db.collection("subs").onSnapshot(snap => onSubs(snap.docs.map(d => fromDoc(d.id, d.data())).filter(Boolean)), onError));
      unsubs.push(db.doc("settings/app").onSnapshot(snap => onSettings(snap.exists ? snap.data() : {}), () => {}));
    },
    saveSub: s => queue("subs/"+s.id, () => retryOnce(() => db.doc("subs/"+s.id).set(toDoc(s)))),
    deleteSub: id => queue("subs/"+id, () => retryOnce(() => db.doc("subs/"+id).delete())),
    saveSettings: o => queue("settings", () => retryOnce(() => db.doc("settings/app").set({display:o.display, rate:o.rate})))
  };
}
function localStore(){

  try { const raw = localStorage.getItem(KEY); if (raw) mem = Object.assign(mem, JSON.parse(raw)); localStorage.setItem(KEY, JSON.stringify(mem)); }
  catch(e){ mode = "memory"; }
  let subsCb = () => {}, setCb = () => {};
  const flush = () => { if (mode === "local") { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch(e){ mode = "memory"; } } };
  const emit = () => { subsCb(Object.entries(mem.subs).map(([id,d]) => fromDoc(id,d)).filter(Boolean)); };
  return {
    get mode(){ return mode; },
    close(){ subsCb = () => {}; setCb = () => {}; },
    subscribe(onSubs, onSettings){ subsCb = onSubs; setCb = onSettings; setTimeout(() => { setCb(mem.settings||{}); emit(); }, 0); },
    saveSub: s => { mem.subs[s.id] = toDoc(s); flush(); return Promise.resolve(); },
    deleteSub: id => { delete mem.subs[id]; flush(); return Promise.resolve(); },

// iCalendar for Apple Calendar / Outlook: an all-day event on each charge date with an alert at 09:00 on the reminder day.
function icsText(list){
  const escI = v => String(v).replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");
  const fold = line => { const enc = new TextEncoder(); let out = "", cur = "", bytes = 0;
    for (const ch of line){ const b = enc.encode(ch).length; if (bytes + b > 73){ out += cur + "\r\n "; cur = ""; bytes = 1; } cur += ch; bytes += b; }
    return out + cur; };
  const now = new Date().toISOString().replace(/[-:]/g,"").replace(/\.\d+Z$/,"Z");
  const lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SUBBU//Reminders//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH","X-WR-CALNAME:" + escI(t("icsCal"))];
  list.forEach(s => {
    const d = iso(s.next).replace(/-/g,""), end = iso(addDays(s.next,1)).replace(/-/g,"");
    lines.push("BEGIN:VEVENT", `UID:${s.id}@subbu`, `DTSTAMP:${now}`, `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${end}`, "RRULE:" + rruleFor(s),
      "SUMMARY:" + escI(`${s.name} · ${priceLabel(s)}`), "DESCRIPTION:" + escI(t("gcalDetails", s.plan, tMethod(s.method))), "TRANSP:TRANSPARENT");
    if (s.remind > 0) lines.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:" + escI(t("gcalText", s.name, priceLabel(s), s.remind)),
      `TRIGGER:-P${s.remind - 1 > 0 ? (s.remind - 1) + "D" : ""}T15H`, "END:VALARM");
    lines.push("END:VEVENT");
  });
  lines.push("END:VCALENDAR");
  return lines.map(fold).join("\r\n") + "\r\n";
}

  if (next) { if (i >= 0) state.subs[i] = next; else state.subs.push(next); }

  rerenderKeep();
  if (!state.preview) persist(next ? store.saveSub(next) : store.deleteSub(id));
  if (message) toast(message, withUndo ? () => commit(id, prev, prev ? t("restored", prev.name) : t("undone"), false) : null);
}

// Future charges come from the next charge date; past ones are estimated by stepping back through the billing cycle.
function monthCharges(first){
  const last = new Date(first.getFullYear(), first.getMonth()+1, 0);
  const map = {};
  const put = (s, d) => (map[iso(d)] = map[iso(d)] || []).push({s, date:new Date(d), past:daysUntil(d) < 0});
  state.subs.filter(s => s.status !== "cancelled").forEach(s => {
    let d = new Date(s.next), g = 0;
    while (d <= last && (!s.inst || d <= s.inst.last) && g++ < 3000){ if (d >= first) put(s, d); d = step(d, s.cycle); }
    if (s.status === "trial") return;
    const start = sod(firstPayment(s));
    d = stepBack(s.next, s.cycle); g = 0;
    while (d >= first && sod(d) >= start && g++ < 3000){ if (d <= last) put(s, d); d = stepBack(d, s.cycle); }
  });
  Object.values(map).forEach(l => l.sort((a,b) => convert(b.s.price,b.s.currency,"THB") - convert(a.s.price,a.s.currency,"THB")));
  return map;
}
function calendarInner(){
  const D = settings.display, first = state.calMonth;
  const map = monthCharges(first);
  const days = new Date(first.getFullYear(), first.getMonth()+1, 0).getDate();
  const lead = first.getDay();
  const tot = l => l.reduce((a,o) => a + convert(o.s.price,o.s.currency,D), 0);
  let paid = 0, toCome = 0, anyConv = false;
  Object.values(map).forEach(l => l.forEach(o => { const v = convert(o.s.price,o.s.currency,D); if (o.s.currency !== D) anyConv = true; o.past ? paid += v : toCome += v; }));
  const sel = state.calSel && state.calSel.getMonth() === first.getMonth() && state.calSel.getFullYear() === first.getFullYear() ? state.calSel : null;
  const isThisMonth = first.getMonth() === TODAY.getMonth() && first.getFullYear() === TODAY.getFullYear();
  const focusDay = sel || (isThisMonth ? TODAY : first);
  const ax = anyConv ? "≈ " : "";
  const monthName = first.toLocaleDateString(loc(),{month:"long",year:"numeric"});
  const sunday = new Date(2024, 0, 7);   // a Sunday, for localized weekday names
  const wds = Array.from({length:7}, (_,i) => { const d = addDays(sunday,i); return [d.toLocaleDateString(loc(),{weekday:"short"}), d.toLocaleDateString(loc(),{weekday:"long"})]; });

  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(`<div class="cal-cell out" role="gridcell" aria-hidden="true"></div>`);
  for (let n = 1; n <= days; n++){
    const d = new Date(first.getFullYear(), first.getMonth(), n), key = iso(d), list = map[key] || [];
    const du = daysUntil(d), tt = tot(list), isSel = !!(sel && iso(sel) === key);
    const cls = ["cal-day"]; if (du === 0) cls.push("today"); if (du < 0) cls.push("past"); if (isSel) cls.push("sel");
    const label = t("dayLabel", fmtLong(d), du === 0, list.length, ax + fm(tt,D));
    cells.push(`<div class="cal-cell" role="gridcell" aria-selected="${isSel}">
      <button type="button" class="${cls.join(" ")}" data-day="${key}" tabindex="${iso(focusDay) === key ? 0 : -1}" aria-label="${esc(label)}">
        <span class="dn">${n}</span>
        ${list.length ? `<span class="cal-items" aria-hidden="true">${list.slice(0,3).map(o => `<span class="cal-chip${o.past?" was":""}${o.s.status==="trial"?" trial":""}" style="${catVar(o.s.cat)}"><i></i><span class="cn">${esc(o.s.name)}</span></span>`).join("")}${list.length > 3 ? `<span class="cal-more">${t("more", list.length-3)}</span>` : ""}</span>
        <span class="cal-dots" aria-hidden="true">${list.slice(0,4).map(o => `<i style="${catVar(o.s.cat)}"></i>`).join("")}</span>
        <span class="cal-tot num" aria-hidden="true">${fm(tt,D)}</span>` : ""}
      </button></div>`);
  }
  const trail = (7 - (lead + days) % 7) % 7;
  for (let i = 0; i < trail; i++) cells.push(`<div class="cal-cell out" role="gridcell" aria-hidden="true"></div>`);
  let grid = ""; for (let i = 0; i < cells.length; i += 7) grid += `<div class="cal-row" role="row">${cells.slice(i,i+7).join("")}</div>`;

  const dayList = sel ? (map[iso(sel)] || []) : null;
  const detail = sel ? `
    <div class="week cal-detail" aria-live="polite">
      <h3>${sel.toLocaleDateString(loc(),{weekday:"long",month:"long",day:"numeric"})}${dayList.length ? ` · <span class="num">${dayList.some(o => o.s.currency !== D) ? "≈ " : ""}${fm(tot(dayList),D)}</span>` : ""}</h3>
      ${dayList.length ? `<ul>${dayList.map(o => chargeRow(o, o.past)).join("")}</ul>` : `<p class="none">${t("noChargesDay")}</p>`}
    </div>` : `<div class="week cal-detail"><p class="none">${t("selectDay")}</p></div>`;

  return `
    <div class="panel-head">
      <div class="up-title"><h2 id="up-h">${monthName}</h2>${upToggle()}</div>
      <p class="meta">${paid ? t("calPaid", ax + fm(paid,D)) : ""}${t("calToCome", ax + fm(toCome,D))}</p>
    </div>
    <div class="cal-nav">
      <button type="button" class="icon-btn" data-cal-nav="-1" aria-label="${esc(t("prevMonth"))}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="icon-btn" data-cal-nav="1" aria-label="${esc(t("nextMonth"))}"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <button type="button" class="btn secondary sm" data-cal-nav="0"${isThisMonth ? " disabled" : ""}>${t("thisMonth")}</button>
      <span class="cal-note">${first <= firstOf(TODAY) ? t("calNote") : ""}</span>
    </div>
    <div class="cal-scroll">
      <div class="cal" role="grid" aria-labelledby="up-h">
        <div class="cal-row cal-wds" role="row">${wds.map(([s,l]) => `<div class="cal-wd" role="columnheader"><abbr title="${esc(l)}">${esc(s)}</abbr></div>`).join("")}</div>
        ${grid}
      </div>
    </div>
    ${detail}`;
}

// Calendar grid: arrows move a day/week, PageUp/PageDown a month, Home/End the week's ends.

function paidSoFar(s, until){
  const months = (a,b) => Math.max(0,(b.getFullYear()-a.getFullYear())*12 + b.getMonth()-a.getMonth());
  if (s.inst && s.inst.total) return (s.inst.total - (s.status === "cancelled" ? 0 : paymentsLeft(s))) * s.price;
  if (!s.history) return months(s.started, until) * monthlyEq(s);
  return s.history.reduce((a,p,i) => a + months(p.date, s.history[i+1] ? s.history[i+1].date : until) * p.price / MONTHS[s.cycle], 0);
}

      </div>`}`;
  drawer.querySelector("#d-close").onclick = closeDrawer;
  if (confirming){
    drawer.querySelector("#cf-no").onclick = () => { drawerHTML(s,false); drawer.querySelector("#d-del").focus(); };

  state.editId = id; form.reset(); clearErrors();
  const s = id ? state.subs.find(x => x.id === id) : null;
  F("f-title").textContent = s ? t("editTitle", s.name) : t("addTitle");
  F("f-submit").textContent = s ? t("submitSave") : t("submitAdd");
  F("f-next").min = iso(TODAY);
  fstate.pickCat = "all";
  if (s){
    fstate.brand = s.brand;
    F("f-name").value = s.name; F("f-plan").value = s.plan; F("f-price").value = s.price.toFixed(2); setFormCurrency(s.currency);
    F("f-cycle").value = s.cycle; F("f-next").value = iso(s.status==="cancelled" ? addDays(TODAY,1) : s.next); F("f-cat").value = s.cat;
    F("f-method").value = s.method; F("f-remind").value = String(s.remind); F("f-trial").checked = s.status === "trial"; F("f-notes").value = s.notes || "";
    F("f-inst").checked = !!s.inst;
    F("f-left").value = s.inst && s.status !== "cancelled" ? String(paymentsLeft(s)) : "";
    F("f-total").value = s.inst && s.inst.total ? String(s.inst.total) : "";
    paintSvc(); paintPlans(); syncInst(); updateSummary();
    dlg.showModal(); showForm(F("f-price"));
    if (s.paidOff) F("f-left").focus();
    return;
  }
  setFormCurrency(lastCurrency || settings.display);
  F("f-next").value = iso(addDays(TODAY, 7));
  dlg.showModal();
  if (presetKey && BRAND[presetKey]) choose(presetKey);
  else { fstate.brand = null; showPick(); }
}
dlg.querySelectorAll("[data-close]").forEach(b => b.onclick = () => dlg.close());
dlg.addEventListener("close", restoreFocus);
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

function parsePrice(v){ const n = parseFloat(String(v).replace(/[฿$,\s]/g,"")); return isFinite(n) ? Math.round(n*100)/100 : NaN; }
const parseCount = v => { const s = String(v).trim(); return /^\d+$/.test(s) ? parseInt(s,10) : NaN; };
function updateSummary(){
  const cur = formCurrency(); F("f-sym").textContent = SYM[cur];
  const price = parsePrice(F("f-price").value), cycle = F("f-cycle").value, trial = F("f-trial").checked, inst = F("f-inst").checked;
  F("f-next-lbl").textContent = trial ? t("trialEndsOn") : inst ? t("nextPayment") : t("nextChargeLbl");
  const nextV = F("f-next").value, remind = +F("f-remind").value;
  const out = F("f-summary");
  if (!(price > 0) || !nextV){ out.textContent = t("sumEnter"); return; }
  const next = parseISO(nextV), D = settings.display;
  const eq = price / MONTHS[cycle];
  let s = t("sumAdds", trial, fm(eq,cur), cur !== D ? t("sumConv", fm(convert(eq,cur,D),D)) : "");
  const left = parseCount(F("f-left").value);
  if (inst && left >= 1 && next) s += t("sumLast", fmtDateY(lastPaymentFrom(next, cycle, left)), fm(price*left,cur));
  else if (!inst) s += t("sumYear", fm(eq*12,cur));
  if (remind > 0 && next && daysUntil(next) >= 0) {
    const r = addDays(next,-remind);
    s += daysUntil(r) >= 0 ? t("sumRemind", fmtShort(r)) : t("sumRemindToday");
  }
  out.textContent = s;
}
["f-price","f-cycle","f-next","f-remind","f-trial","f-cur-thb","f-cur-usd","f-left","f-total"].forEach(id => { F(id).addEventListener("input", updateSummary); F(id).addEventListener("change", updateSummary); });
["f-cur-thb","f-cur-usd"].forEach(id => F(id).addEventListener("change", markPlan));

const ERR_FIELDS = ["f-name","f-price","f-next","f-left","f-total"];
function setErr(id, msg){
  const input = F(id), err = F(id + "-err");
  if (msg){ input.setAttribute("aria-invalid","true"); err.hidden = false; err.textContent = msg; }
  else { input.removeAttribute("aria-invalid"); err.hidden = true; err.textContent = ""; }
}
function clearErrors(){ ERR_FIELDS.forEach(id => setErr(id,null)); F("f-formerr").hidden = true; }
ERR_FIELDS.forEach(id => F(id).addEventListener("input", () => { if (F(id).getAttribute("aria-invalid")) setErr(id,null); }));

form.addEventListener("submit", e => {
  e.preventDefault();
  clearErrors();
  const name = F("f-name").value.trim(), price = parsePrice(F("f-price").value), nextV = F("f-next").value, trial = F("f-trial").checked, cur = formCurrency();
  const inst = F("f-inst").checked, left = parseCount(F("f-left").value), totalRaw = F("f-total").value.trim(), total = totalRaw ? parseCount(totalRaw) : null;
  const errs = [];
  if (!name) errs.push(["f-name", t("eNameReq")]);
  else if (name.length > 80) errs.push(["f-name", t("eNameLong")]);
  else if (state.subs.some(x => x.name.toLowerCase() === name.toLowerCase() && x.plan.toLowerCase() === F("f-plan").value.trim().toLowerCase() && x.id !== state.editId && x.status !== "cancelled"))
    errs.push(["f-name", t("eDup", name)]);
  const max = cur === "THB" ? 5000000 : 150000;
  if (!F("f-price").value.trim()) errs.push(["f-price", trial ? t("ePriceTrial") : inst ? t("ePriceInst") : t("ePriceReq")]);
  else if (!(price > 0)) errs.push(["f-price", t("ePriceMin", SYM[cur], cur === "THB" ? "149" : "9.99")]);
  else if (price > max) errs.push(["f-price", t("ePriceMax", fm(max,cur))]);
  if (!nextV) errs.push(["f-next", t("eNextReq")]);
  else if (daysUntil(parseISO(nextV)) < 0) errs.push(["f-next", t("eNextPast")]);
  if (inst){
    if (!F("f-left").value.trim()) errs.push(["f-left", t("eLeftReq")]);
    else if (!(left >= 1 && left <= 600)) errs.push(["f-left", t("eLeftRange")]);
    if (totalRaw && !(total >= 1 && total <= 600)) errs.push(["f-total", t("eTotalRange")]);
    else if (totalRaw && left >= 1 && total < left) errs.push(["f-total", t("eTotalLess", left)]);
  }
  if (errs.length){
    errs.forEach(([id,m]) => setErr(id,m));
    F("f-formerr").hidden = errs.length < 2; F("f-formerr").textContent = t("eFix", errs.length);
    F(errs[0][0]).focus();
    return;
  }
  lastCurrency = cur;
  const next = parseISO(nextV), cycle = F("f-cycle").value;
  const data = { name, brand:fstate.brand, plan:F("f-plan").value.trim().slice(0,80), price, currency:cur, cycle, next, cat:F("f-cat").value,
    method:F("f-method").value, remind:+F("f-remind").value, notes:F("f-notes").value.trim().slice(0,1000), status: trial ? "trial" : "active",
    cancelledOn:null, paidOff:false, inst: inst ? {last:lastPaymentFrom(next, cycle, left), total} : null };
  if (state.editId){
    const s = structuredClone(state.subs.find(x => x.id === state.editId));
    if (s.status !== "trial" && !trial && s.currency === cur && s.price !== price){
      s.history = s.history || [{date:s.started, price:s.price}];
      s.history.push({date:new Date(TODAY), price});
    } else if (s.currency !== cur) s.history = null;   // old prices can't be compared across currencies
    Object.assign(s, data);
    dlg.close(); commit(s.id, s, t("tSaved", name));
  } else {
    const id = "s-" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    state.tab = trial ? "trial" : "active";
    dlg.close();
    commit(id, Object.assign({id, started:new Date(TODAY), history:null}, data), trial ? t("tAddedTrial", name, fmtShort(next)) : t("tAdded", name, fmtShort(next)));
  }
});

/* ---------- boot ---------- */
function connect(){
  let gotSubs = false;
  store.subscribe(
    subs => {
      gotSubs = true; if (state.preview) { state.saved = subs; return; }
      state.subs = subs; state.view = "data"; rerenderKeep();
      checkMigration(subs);
      if (pendingAction === "add"){ pendingAction = null; try { history.replaceState(null, "", location.pathname); } catch(e){} openForm(null, document.getElementById("addBtn")); }
    },
    s => {
      if (s && CURRENCIES.includes(s.display)) settings.display = s.display;
      const r = Number(s && s.rate); if (r >= 1 && r <= 100) settings.rate = r;
      if (state.view === "data" && !state.editingRate) rerenderKeep();
    },
    err => { if (!gotSubs || (err && err.code === "revoked")) { state.view = "error"; render(); } }
  );
}
applyStatic();
render();
boot();
})();
</script>
